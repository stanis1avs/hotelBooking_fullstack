server {
  listen 80;
  server_name _;
  root /usr/share/nginx/html;
  index index.html;

  # Бэкенд проксируется через тот же origin: фронтенду не нужен
  # захардкоженный адрес API на этапе сборки, а cookie остаётся
  # первой стороной — CORS в этой схеме не участвует вовсе.
  location /api/ {
    proxy_pass http://backend:7000;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    # Загрузка фотографий отелей и номеров
    client_max_body_size 12m;
  }

  location /graphql {
    proxy_pass http://backend:7000;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
  }

  # Чат поддержки работает по WebSocket — нужен апгрейд соединения
  location /support/ {
    proxy_pass http://backend:7000;
    proxy_http_version 1.1;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection "upgrade";
    proxy_set_header Host $host;
    proxy_read_timeout 3600s;
  }

  location /socket.io/ {
    proxy_pass http://backend:7000;
    proxy_http_version 1.1;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection "upgrade";
    proxy_set_header Host $host;
    proxy_read_timeout 3600s;
  }

  # Angular использует History API: любой неизвестный путь отдаём index.html,
  # иначе прямой переход по /admin/hotels вернёт 404 от nginx.
  location / {
    try_files $uri $uri/ /index.html;
  }

  location ~* \.(?:js|css|woff2?|png|jpg|jpeg|svg|ico)$ {
    expires 1y;
    add_header Cache-Control "public, immutable";
  }

  gzip on;
  gzip_types text/css application/javascript application/json image/svg+xml;
  gzip_min_length 1024;
}
